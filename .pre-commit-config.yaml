repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-toml

  - repo: "https://github.com/asottile/pyupgrade"
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args:
          - "--py36-plus"
